name: tool-ci

# No-compute PR gate for tool contributions.
#
# Every catalog tool is exercised in mock mode against the standardized
# ToolResult contract; only tools *changed by the PR* gate the merge, the
# rest are informational (so legacy debt never blocks a contributor).
# Heavy-dependency tools that cannot even import on the runner are
# reported as DEP-SKIP, not failed — the with-compute lane
# (tool-real-smoke.yml) covers them.

# Trigger only on PRs that touch the tool stack:
# - spagent/tools/**            the tools themselves + catalog
# - spagent/core/**             the ToolResult contract / render layer every
#                               tool is validated against (a core change gates
#                               ALL tools via --changed-from)
# - spagent/external_experts/** clients + mock services the tools call in mock mode
# - the harness + contract test files themselves
on:
  pull_request:
    paths:
      - "spagent/tools/**"
      - "spagent/core/**"
      - "spagent/external_experts/**"
      - "test/tool_ci_report.py"
      - "test/tool_real_smoke.py"
      - "test/test_tool_result.py"
      - "test/test_render.py"
      - "test/test_render_integration.py"
      - "test/verify_all_tools.py"
      - ".github/workflows/tool-ci.yml"

jobs:
  tool-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install no-compute deps
        run: python -m pip install numpy pillow requests opencv-python-headless
      - name: Tool contract report (gates changed tools, reports all)
        run: python test/tool_ci_report.py --changed-from "${{ github.event.pull_request.base.sha }}"

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test deps
        run: python -m pip install pytest numpy pillow requests opencv-python-headless
      - name: Core contract/render suite
        run: python -m pytest test/test_tool_result.py test/test_render.py test/test_render_integration.py -q
